<section class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-7">

<h1 class="text-center mb-4">Event Registration</h1>

<div class="card p-4">

<form>

<div class="mb-3">
<label class="form-label">Student Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>

<div class="mb-3">
<label class="form-label">Roll Number</label>
<input type="text" class="form-control" placeholder="Enter roll number">
</div>

<div class="mb-3">
<label class="form-label">Branch</label>
<input type="text" class="form-control" placeholder="Enter branch">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" placeholder="Enter email">
</div>

<div class="mb-3">
<label class="form-label">Mobile Number</label>
<input type="tel" class="form-control" placeholder="Enter mobile number">
</div>

<div class="mb-3">
<label class="form-label">Select Event</label>
<select class="form-select">
<option selected>Select Event</option>
<option>Technical Quiz</option>
<option>Hackathon</option>
<option>Poster Presentation</option>
<option>Coding Contest</option>
<option>Project Expo</option>
<option>Cultural Fest</option>
</select>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-primary">Register</button>
</div>

</form>

<div class="alert alert-success mt-4 mb-0">
Registration Successful
</div>

</div>

</div>
</div>
</section>

<footer>
<p class="mb-0">© 2026 College Event Management System</p>
</footer>
